<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">감정의 온도</title>
  <desc id="desc">하트와 온도계를 결합한 민트색 심볼과 감정의 온도 한글 로고타입</desc>

  <g color="#D8FFFA">
    <!-- Brand mark: film frame + emotion (heart) + temperature (gauge) -->
    <rect x="3" y="8" width="66" height="56" rx="12" stroke="currentColor" stroke-width="3"/>
    <rect x="8" y="14" width="6" height="7" rx="2" fill="currentColor"/>
    <rect x="8" y="28.5" width="6" height="7" rx="2" fill="currentColor"/>
    <rect x="8" y="43" width="6" height="7" rx="2" fill="currentColor"/>
    <rect x="58" y="14" width="6" height="7" rx="2" fill="currentColor"/>
    <rect x="58" y="28.5" width="6" height="7" rx="2" fill="currentColor"/>
    <rect x="58" y="43" width="6" height="7" rx="2" fill="currentColor"/>
    <path d="M20 27.5C20 23.358 23.358 20 27.5 20C31.062 20 33.796 21.869 36 24.667C38.204 21.869 40.938 20 44.5 20C48.642 20 52 23.358 52 27.5C52 35.843 44.801 41.072 36 47.5C27.199 41.072 20 35.843 20 27.5Z" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M36 27V43" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="36" cy="45" r="4" fill="currentColor"/>
    <!-- Play cue makes the movie-recommendation context immediate -->
    <path d="M28.5 29.5L34.5 33L28.5 36.5V29.5Z" fill="currentColor"/>
    <path d="M23 55H49" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

    <!-- Wordmark -->
    <text x="91" y="45" fill="currentColor"
      font-family="Pretendard, SUIT, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif"
      font-size="27" font-weight="800" letter-spacing="-0.7">감정의 온도</text>

    <!-- Temperature accent -->
    <path d="M278 49H342" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.34"/>
    <circle cx="342" cy="49" r="3" fill="currentColor"/>
  </g>
</svg>
